[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hartnet"
version = "0.2.0"
description = "Profile-based Art-Net control for Home Assistant"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.13,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-aiohttp>=1,<2", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["apps/hartnet"]

[tool.setuptools.package-data]
hartnet = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
